# ==================== kun 多平台发布 ====================
# 触发：推送 v* 标签（如 v0.1.0），或 Actions 页手动 Run workflow。
# 流程：四平台矩阵原生构建（macOS ARM/Intel、Linux x64、Windows x64）→
#       macOS 打 .app + dmg、Linux tar.gz、Windows zip → 上传 GitHub Release。
# 说明：产物未签名/未公证（可后续配置）；版本号取自 git tag。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon；Intel 用官方 Intel runner，避免交叉编译链问题。
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: kun-macos-arm64
            package: dmg
          - name: macOS Intel
            platform: macos-15-intel
            artifact: kun-macos-x64
            package: dmg
          - name: Linux x64
            platform: ubuntu-22.04
            artifact: kun-linux-x64
            package: targz
          - name: Windows x64
            platform: windows-latest
            artifact: kun-windows-x64
            package: zip

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build release
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace

      # ============ macOS：.app + dmg ============
      - name: Package macOS (.app + dmg)
        if: matrix.package == 'dmg'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-macos.sh "$VERSION"

      - name: Upload macOS artifact
        if: matrix.package == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/kun-*.dmg
            target/release/kun.icns

      # ============ Linux：tar.gz ============
      - name: Package Linux (tar.gz)
        if: matrix.package == 'targz'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/kun-${VERSION}-linux-x64.tar.gz" -C target/release kun-app

      - name: Upload Linux artifact
        if: matrix.package == 'targz'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/kun-*.tar.gz

      # ============ Windows：zip ============
      - name: Package Windows (zip)
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/release/kun-app.exe -DestinationPath "dist/kun-$version-windows-x64.zip"

      - name: Upload Windows artifact
        if: matrix.package == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/kun-*.zip

  # ============ 汇总发布到 GitHub Release ============
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(bash scripts/release-notes.sh "$VERSION")"
          if [ -z "$NOTES" ]; then
            NOTES="$(bash scripts/release-notes.sh)"
          fi
          echo "body<<__KUN_NOTES__" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "__KUN_NOTES__" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kun ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
