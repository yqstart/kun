# ==================== Mino 发布（macOS） ====================
# 触发：推送 v* 标签（如 v0.1.0），或 Actions 页手动 Run workflow。
# 流程：macOS ARM / Intel 原生构建 → .app + dmg → 上传 GitHub Release。
# 说明：产物未签名/未公证（可后续配置）；版本号取自 git tag。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 git 标签（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # ARM runner 上的 UI 测试可能因图形环境挂起；限时失败以便重试。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon；Intel 用官方 Intel runner，避免交叉编译链问题。
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: mino-macos-arm64
            package: dmg
            arch: arm64
          - name: macOS Intel
            platform: macos-15-intel
            artifact: mino-macos-x64
            package: dmg
            arch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误：发布 tag 必须是 v<主>.<次>.<补丁>，实际为 $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "错误：找不到发布 tag $TAG" >&2
            exit 1
          }
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml | head -n 1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "错误：tag 版本 $VERSION 与 Cargo 版本 $CARGO_VERSION 不一致" >&2
            exit 1
          fi
          grep -Eq "^## \[$VERSION\]( |$)" CHANGELOG.md || {
            echo "错误：CHANGELOG.md 缺少 ## [$VERSION] 版本段落" >&2
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build release
        run: cargo build --release --workspace

      # macOS UI 测试（egui_kittest）放在 Intel runner：Apple Silicon runner 上
      # UI 测试放在 Intel runner，避免 Apple Silicon 图形环境差异阻断发版。
      # 功能回归仍由 CI（Linux）+ 本矩阵 Intel 覆盖；ARM 只负责原生 arm64 打包。
      - name: Run tests
        if: matrix.arch == 'x64'
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1

      # ============ macOS：.app + dmg ============
      - name: Package macOS (.app + dmg)
        if: matrix.package == 'dmg'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          bash scripts/package-macos.sh "$VERSION" "${{ matrix.arch }}"
          ls -lh target/release/*.dmg

      - name: Upload macOS artifact
        if: matrix.package == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/mino-*.dmg
            target/release/mino.icns

  # ============ 汇总发布到 GitHub Release ============
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES="$(bash scripts/release-notes.sh "$VERSION")"
          if [ -z "$NOTES" ]; then
            NOTES="$(bash scripts/release-notes.sh)"
          fi
          echo "body<<__MINO_NOTES__" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "__MINO_NOTES__" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mino ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
