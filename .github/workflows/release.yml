# ==================== kun 发布（macOS） ====================
# 触发：推送 v* 标签（如 v0.1.0），或 Actions 页手动 Run workflow。
# 流程：macOS ARM / Intel 原生构建 → .app + dmg → 上传 GitHub Release。
# 说明：产物未签名/未公证（可后续配置）；版本号取自 git tag。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # v0.7.0：ARM runner 曾在 UI 测试中挂死 4.5h（手动取消）；限时失败以便重试。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon；Intel 用官方 Intel runner，避免交叉编译链问题。
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: kun-macos-arm64
            package: dmg
            arch: arm64
          - name: macOS Intel
            platform: macos-15-intel
            artifact: kun-macos-x64
            package: dmg
            arch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build release
        run: cargo build --release --workspace

      # macOS UI 测试（egui_kittest）放在 Intel runner：Apple Silicon runner 上
      # 曾两次在同一批 UI 测试中挂死数小时（v0.7.0），阻断发版。
      # 功能回归仍由 CI（Linux）+ 本矩阵 Intel 覆盖；ARM 只负责原生 arm64 打包。
      - name: Run tests
        if: matrix.arch == 'x64'
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1

      # ============ macOS：.app + dmg ============
      - name: Package macOS (.app + dmg)
        if: matrix.package == 'dmg'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-macos.sh "$VERSION" "${{ matrix.arch }}"
          ls -lh target/release/*.dmg

      - name: Upload macOS artifact
        if: matrix.package == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/kun-*.dmg
            target/release/kun.icns

  # ============ 汇总发布到 GitHub Release ============
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(bash scripts/release-notes.sh "$VERSION")"
          if [ -z "$NOTES" ]; then
            NOTES="$(bash scripts/release-notes.sh)"
          fi
          echo "body<<__KUN_NOTES__" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "__KUN_NOTES__" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kun ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
