[package]
name = "mino-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mino 轻量终端与 SFTP GUI 应用"

[dependencies]
mino-core = { path = "../mino-core" }
eframe = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
alacritty_terminal = "0.26"
rfd = "0.15"
image = "0.25"

# macOS 原生窗口圆角（无边框窗口 contentView layer cornerRadius）。
# features 全局合并：追加 objc2-quartz-core 不会影响 eframe/winit 的既有实例。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["std", "NSColor", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2 = "0.6.4"
raw-window-handle = "0.6.2"

[dev-dependencies]
accesskit = "0.24"
egui_kittest = { version = "0.36.1", features = ["eframe", "snapshot", "wgpu"] }
kittest = "0.4"
