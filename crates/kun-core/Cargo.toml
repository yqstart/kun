[package]
name = "kun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kun 终端与 SFTP 引擎"

[dependencies]
alacritty_terminal = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
ureq = "3"
regex = "1"

[dependencies.russh]
version = "0.62"
default-features = false
# 纯 Rust 后端（ring）替代默认 aws-lc-rs（C 库，交叉编译困难）；
# flate2 用于 SSH 压缩协商兼容。
features = ["ring", "rsa", "flate2"]

[dependencies.russh-sftp]
version = "2.4"

[dev-dependencies]
env_logger = "0.11"
