[package]
name = "mino-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mino 终端与 SFTP 引擎"

[dependencies]
alacritty_terminal = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
ureq = "3"

# libc 仅 unix 平台使用（SIGKILL 兜底关闭本地 shell）；Windows 无此概念。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.russh]
version = "0.62"
default-features = false
# 纯 Rust 后端（ring）替代默认 aws-lc-rs（C 库，交叉编译困难）；
# flate2 用于 SSH 压缩协商兼容。
features = ["ring", "rsa", "flate2"]

[dependencies.russh-sftp]
version = "2.4"

[dev-dependencies]
env_logger = "0.11"
# known_hosts 测试生成临时密钥对（版本与 russh 0.62 的 rand_core 一致）。
rand = "0.10"
